name: Build Windows UI Only
on:
  workflow_dispatch:
    inputs:
      runon:
        description: 'Windows architecture'
        type: choice
        required: true
        default: windows-latest
        options:
          - windows-latest
          - windows-11-arm

jobs:
  build-win-ui:
    runs-on: ${{ inputs.runon }}
    steps:
      - uses: actions/checkout@v7
        with:
           fetch-depth: 1

      - uses: pnpm/setup@v3
        with:
          version: 12.15.0
          runtime: node@26
          cache: true

      # - uses: pnpm/action-setup@v6
      #   with:
      #     version: 12.15.0

      # - uses: actions/setup-node@v6
      #   with:
      #     node-version: 26
      #     cache: 'pnpm'

      - name: Install and Pack UI
        run: |
          pnpm install
          node scripts/build/electron-runtime.mjs --source .
          pnpm --dir apps/desktop run pack

      - name: Upload Windows Unpacked Zip
        uses: actions/upload-artifact@v7
        with:
          name: Hermes-Windows-UI-${{ inputs.runon }}
          path: ${{ inputs.runon == 'windows-11-arm' && 'apps/desktop/release/win-arm64-unpacked' || 'apps/desktop/release/win-unpacked' }}